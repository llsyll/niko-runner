<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Niko 超慢跑</title>
    <meta name="description" content="超慢跑节拍器 & 计时助手">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
    <div class="app-container">
        <!-- Silent Audio Loop Trigger -->
        <audio id="silent-audio" loop playsinline>
            <source
                src="data:audio/mp3;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAbXA0MgBUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibZVfYnJhbmRzAGlzb21tcDQyAFRTU0UAAAAPAAADTGF2ZjU5LjI3LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIwAAQUFBRUVFRkpKSk9PT1BQUFZWVltbW15eXmNjY2hoaGxsbHJycnd3d3x8fIWFhYqKioyMjJKSkpWVlZqamp+fn6Kioqenp62tra+vr7Kysre3t7y8vMHBwcTExMrKys/Pz9PT09ra2t/f3+Tk5Ojo6Ozs7PLy8vb29v///wAAAANMYXZjNTkuMzcuMTAwAAAAAAAAAAAAAAAAIAbAAAAAAAAAAAAAAAAB//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA//tQZAAAAAAAOgAAAAAAAABAAAAAAAAAAAA"
                type="audio/mpeg">
        </audio>

        <!-- Top Section: Progress Ring & Play/Pause -->
        <div class="progress-ring-container" id="play-pause-area">
            <svg class="progress-ring" viewBox="0 0 300 200">
                <!-- Background Track -->
                <rect class="ring-bg" x="10" y="10" width="280" height="180" rx="40" ry="40" />
                <!-- Progress Indicator (Stroke) -->
                <rect class="ring-progress" id="progress-rect" x="10" y="10" width="280" height="180" rx="40" ry="40" />
            </svg>

            <div class="play-icon-container">
                <!-- Play Icon (Triangle) -->
                <svg id="icon-play" class="control-icon" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 5V19L19 12L8 5Z" fill="white" />
                </svg>
                <!-- Pause Icon (Double Bar) -->
                <svg id="icon-pause" class="control-icon hidden" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="4" width="4" height="16" fill="white" />
                    <rect x="14" y="4" width="4" height="16" fill="white" />
                </svg>
            </div>
        </div>

        <!-- Middle Section: Timer & Info -->
        <div class="timer-section">
            <div class="timer-label">剩余时间</div>
            <div id="time-remaining" class="main-timer">20:00</div>

            <div class="controls-row">
                <button id="start-btn" class="control-btn start-btn">开始</button>
                <button id="stop-btn" class="control-btn stop-btn">停止</button>
            </div>
        </div>

        <!-- Hidden BPM Settings / Toggles -->
        <div class="bpm-section">
            <div class="bpm-controls">
                <input type="range" id="bpm-slider" min="150" max="200" value="180" class="slider">
                <div class="bpm-readout"><span id="current-bpm">180</span> BPM</div>
            </div>
        </div>

        <!-- Bottom Section: Quick Duration Select -->
        <div class="quick-actions">
            <button class="chip active" data-time="5">5 mins</button>
            <button class="chip" data-time="10">10 mins</button>
            <button class="chip" data-time="15">15 mins</button>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="sw.js"></script>
</body>

</html>
